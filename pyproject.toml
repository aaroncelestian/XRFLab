[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrflab"
version = "1.0.0"
description = "Desktop XRF spectrum analysis: fitting, calibration, and semi-quantitative intensities"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "XRFLab contributors" }]
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "xraylib>=4.1.3",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "h5py>=3.9.0",
    "openpyxl>=3.1.0",
    "fisx>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
advanced = []  # Optional PyMca5 installed separately when available

[project.scripts]
xrflab = "main:main"

[tool.setuptools]
py-modules = ["main", "matplotlib_config"]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
